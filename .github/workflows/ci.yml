name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: ${{ matrix.package }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - stories_player
          - stories_player_video
          - stories_player_lottie
          - stories_player_audio
          - stories_player/example
    defaults:
      run:
        working-directory: packages/${{ matrix.package }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Format
        run: dart format --output=none --set-exit-if-changed .
      - name: Analyze
        run: flutter analyze --fatal-infos --fatal-warnings
      - name: Test
        if: ${{ hashFiles(format('packages/{0}/test/**', matrix.package)) != '' }}
        run: flutter test --exclude-tags golden

  goldens:
    name: goldens (macOS)
    runs-on: macos-latest
    defaults:
      run:
        working-directory: packages/stories_player
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter test --tags golden

  score:
    name: pub score and web build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          cache: true
      - run: dart pub global activate pana
      - name: pana (core must keep 160/160)
        working-directory: packages/stories_player
        run: dart pub global run pana --exit-code-threshold 0 .
      - name: Web build (WASM)
        working-directory: packages/stories_player/example
        run: flutter build web --wasm --no-web-resources-cdn
